name: PhotoDropMac

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      ENABLE_TESTABILITY: YES

packages:
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    from: "1.3.0"

targets:
  PhotoDropMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/PhotoDropMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsvb.PhotoDropMac
        PRODUCT_NAME: PhotoDropMac
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_ENTITLEMENTS: PhotoDropMac.entitlements
    scheme:
      testTargets:
        - PhotoDropMacTests
      gatherCoverageData: true

  PhotoDropMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PhotoDropMacTests
    dependencies:
      - target: PhotoDropMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsvb.PhotoDropMacTests
        GENERATE_INFOPLIST_FILE: YES

  # Headless command-line tool. Compiles the shared Core/ sources (engines +
  # pure logic) plus the CLI front-end; never the UI.
  photodrop:
    type: tool
    platform: macOS
    sources:
      - path: Sources/PhotoDropMac/Core
      - path: Sources/PhotoDropCLI
    dependencies:
      - package: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: photodrop

schemes:
  photodrop:
    build:
      targets:
        photodrop: all
    run:
      config: Debug
