name: PhotoDropMac

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
  configs:
    # Local dev: ad-hoc signed, hardened runtime off — fast, no certificate
    # needed. Matches the historical setup.
    Debug:
      ENABLE_TESTABILITY: YES
      ENABLE_HARDENED_RUNTIME: NO
      CODE_SIGN_IDENTITY: "-"
    # Distribution: Developer ID + hardened runtime + secure timestamp, the
    # combination Apple notarization requires. Needs a paid Apple Developer
    # Program membership and a "Developer ID Application" certificate in the
    # keychain (see RELEASING.md). Set DEVELOPMENT_TEAM to your 10-char Team ID
    # once enrolled, or pass DEVELOPMENT_TEAM=XXXXXXXXXX to xcodebuild.
    Release:
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_IDENTITY: "Developer ID Application"
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      DEVELOPMENT_TEAM: ""

packages:
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    from: "1.3.0"

targets:
  PhotoDropMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/PhotoDropMac
    dependencies:
      # Ship the headless CLI inside the app at Contents/MacOS/photodrop so the
      # scheduled-verification feature works with zero setup. link:false — the
      # tool is a standalone executable, not linked into the app binary;
      # embed copies it in and code-signs it on copy (covered by notarization).
      - target: photodrop
        link: false
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsvb.PhotoDropMac
        PRODUCT_NAME: PhotoDropMac
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 tsvb. MIT licensed."
        CODE_SIGN_ENTITLEMENTS: PhotoDropMac.entitlements
    scheme:
      testTargets:
        - PhotoDropMacTests
      gatherCoverageData: true

  PhotoDropMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PhotoDropMacTests
    dependencies:
      - target: PhotoDropMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsvb.PhotoDropMacTests
        GENERATE_INFOPLIST_FILE: YES

  # Headless command-line tool. Compiles the shared Core/ sources (engines +
  # pure logic) plus the CLI front-end; never the UI.
  photodrop:
    type: tool
    platform: macOS
    sources:
      - path: Sources/PhotoDropMac/Core
      - path: Sources/PhotoDropCLI
    dependencies:
      - package: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: photodrop

schemes:
  photodrop:
    build:
      targets:
        photodrop: all
    run:
      config: Debug
