<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="PhotoDrop — verified photo ingestion for macOS">
  <title>PhotoDrop for macOS</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1270"/>
      <stop offset="0.45" stop-color="#120A8F"/>
      <stop offset="1" stop-color="#2B1FB0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.16" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <style>
      .wordmark { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono     { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Card panel — self-contained so it reads on light and dark backgrounds alike -->
  <rect x="6" y="6" width="1188" height="328" rx="26" fill="url(#bg)"/>
  <rect x="6" y="6" width="1188" height="328" rx="26" fill="url(#glow)"/>

  <!-- Seal-grid verification mark: 4x4 cells filling as bundles verify -->
  <g>
    <!-- row 0 -->
    <rect x="72"  y="80"  width="36" height="36" rx="7" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="120" y="80"  width="36" height="36" rx="7" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="168" y="80"  width="36" height="36" rx="7" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="216" y="80"  width="36" height="36" rx="7" fill="#FFFFFF" fill-opacity="0.96"/>
    <!-- row 1 -->
    <rect x="72"  y="128" width="36" height="36" rx="7" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="120" y="128" width="36" height="36" rx="7" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="168" y="128" width="36" height="36" rx="7" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="216" y="128" width="36" height="36" rx="7" fill="#FFFFFF" fill-opacity="0.96"/>
    <!-- row 2 -->
    <rect x="72"  y="176" width="36" height="36" rx="7" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="120" y="176" width="36" height="36" rx="7" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="168" y="176" width="36" height="36" rx="7" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="216" y="176" width="36" height="36" rx="7" fill="#FFFFFF" fill-opacity="0.96"/>
    <!-- row 3 — last few still verifying; one marigold accent cell -->
    <rect x="72"  y="224" width="36" height="36" rx="7" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="120" y="224" width="36" height="36" rx="7" fill="#E89E29" fill-opacity="0.95"/>
    <rect x="168" y="224" width="36" height="36" rx="7" fill="#FFFFFF" fill-opacity="0.45"/>
    <rect x="216" y="224" width="36" height="36" rx="7" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"/>
  </g>

  <!-- Wordmark + tagline -->
  <text class="wordmark" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" x="300" y="150" font-size="84" font-weight="700" letter-spacing="-1" fill="#FFFFFF">PhotoDrop</text>
  <text class="wordmark" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" x="302" y="196" font-size="26" font-weight="500" fill="#FFFFFF" fill-opacity="0.85">Verified photo ingestion for macOS</text>
  <text class="mono"     font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" x="303" y="238" font-size="21" fill="#CFC9FF" fill-opacity="0.72">every byte hash-checked &#160;&#183;&#160; [a3f7&#8230;7fa3]&#160; verified</text>
</svg>
