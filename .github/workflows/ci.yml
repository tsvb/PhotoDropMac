name: CI

# Until this existed, nothing ran the suite except a human typing xcodebuild —
# and `scripts/release.sh` could notarize a DMG from untested code. Several of
# the data-safety defects this suite now guards against shipped and sat unnoticed
# for exactly that reason.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (${{ matrix.runner }})
    # The test bundle is HOSTED — it loads into the app, so the app must launch
    # and a GUI session is required. GitHub's macOS runners provide one; a
    # headless container would not.
    #
    # Two images on purpose. Releases are cut from the developer's machine on
    # the current Xcode; CI ran only the previous year's image, so the toolchain
    # that gated a release was never the one that built it. The older image
    # stays because it is the slower type checker — the one that has already
    # failed builds this machine passed (see `ApertureMark.draw`).
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      # The .xcodeproj is gitignored and generated; there is nothing to build
      # until this runs.
      - name: Generate project
        run: xcodegen generate

      # Resolve the SPM dependency (swift-argument-parser) as its own step so a
      # network failure reads as a network failure rather than a build error.
      - name: Resolve package dependencies
        run: xcodebuild -project PhotoDropMac.xcodeproj -resolvePackageDependencies

      - name: Test the app (Debug)
        run: |
          set -o pipefail
          xcodebuild -project PhotoDropMac.xcodeproj -scheme PhotoDropMac \
                     -configuration Debug -destination 'platform=macOS' \
                     -resultBundlePath TestResults.xcresult test

      # A -target build mishandles the SPM module under Swift 6 explicit
      # modules, so this must go through the scheme.
      - name: Build the photodrop CLI
        run: |
          set -o pipefail
          xcodebuild -project PhotoDropMac.xcodeproj -scheme photodrop \
                     -configuration Debug -destination 'platform=macOS' build

      # The suite is supposed to be hermetic: it injects its log directory,
      # UserDefaults suite, cache and index store. If a new side effect creeps
      # back in, it shows up here as a log written to the runner's home.
      - name: Assert the suite left no trace in ~/Library/Logs/PhotoDrop
        run: |
          if [ -d "$HOME/Library/Logs/PhotoDrop" ]; then
            count=$(ls -1 "$HOME/Library/Logs/PhotoDrop" | wc -l | tr -d ' ')
            if [ "$count" != "0" ]; then
              echo "::error::The test suite wrote $count file(s) into the real log directory."
              echo "Tests must inject a log directory — see Copier.hermetic(in:)."
              ls -la "$HOME/Library/Logs/PhotoDrop"
              exit 1
            fi
          fi
          echo "Clean."

      # The scheduled-verify install path writes a launchd plist and runs
      # launchctl. Both are injected (ScheduledVerification.Agent) so the suite
      # never touches the real ones — measured the hard way: before the
      # injection existed, one red-phase run wrote and removed a plist in the
      # developer's actual ~/Library/LaunchAgents and invoked the real
      # launchctl. A test must never be able to install a login item.
      - name: Assert the suite installed no launch agent
        run: |
          plist="$HOME/Library/LaunchAgents/com.tsvb.photodrop.verify.plist"
          if [ -e "$plist" ]; then
            echo "::error::The test suite wrote a real launch agent at $plist."
            echo "Tests must inject an agent — see ScheduledVerification.Agent."
            exit 1
          fi
          echo "Clean."

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ matrix.runner }}
          path: TestResults.xcresult
          retention-days: 7

  docs:
    name: Doc links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # CLAUDE.md accumulated 13 broken source links by surviving a directory
      # reorganisation; every one of them silently sends a reader — human or
      # agent — to a file that isn't there. This is mechanical to catch.
      - name: Check relative markdown links resolve
        run: ./scripts/check-doc-links.sh

      # ubuntu-latest does not ship xmllint. Without this the appcast step
      # exited 127 on every push after the feed was added, and main read as red
      # for a missing tool rather than for anything in the repo.
      - name: Install xmllint
        run: sudo apt-get update -q && sudo apt-get install -y -q libxml2-utils

      # appcast.xml IS the update channel: every installed copy of PhotoDrop
      # reads this one file. A malformed feed does not produce an error anywhere
      # a user can see — Sparkle simply reports "no update available", forever,
      # including for a release that fixes something urgent. It is cheap to check
      # that it parses and still has the marker scripts/appcast.sh inserts at.
      - name: Check the appcast parses
        run: |
          xmllint --noout appcast.xml
          grep -q "NEW ITEMS ARE INSERTED DIRECTLY BELOW THIS LINE" appcast.xml \
            || { echo "::error::appcast.xml has lost the marker scripts/appcast.sh inserts at."; exit 1; }
          grep -q "<key>SUFeedURL</key>" Info.plist \
            || { echo "::error::Info.plist has no SUFeedURL — the app could never check for updates."; exit 1; }

      # The cask is what `brew install --cask tsvb/tap/photodropmac` reads. A
      # syntax error there is a tap that fails for every brew user at once.
      - name: Check the Homebrew cask parses
        run: ruby -c homebrew/Casks/photodropmac.rb
